name: Rosemary S-vendor - BakaSU, SUSFS, NoMount and Droidspaces

on:
  push:
    branches:
      - feature/s-vendor-root-droidspaces
  pull_request:
    branches:
      - rosemary-13
  workflow_dispatch:
    inputs:
      variant:
        description: Kernel build variant
        required: true
        default: bakasu_susfs_nomount_droidspaces
        type: choice
        options:
          - stock_droidspaces
          - bakasu_droidspaces
          - bakasu_nomount_droidspaces
          - bakasu_susfs_droidspaces
          - bakasu_susfs_nomount_droidspaces
      enable_userns:
        description: Enable USER_NS (container sandboxing, increases kernel attack surface)
        required: false
        type: boolean
        default: false
      enable_bore:
        description: Experimental BORE - fails if S-vendor source has no BORE support
        required: false
        type: boolean
        default: false
      nomount_netlink_proto:
        description: NoMount protocol (kernel and userspace must match)
        required: true
        type: choice
        default: '29'
        options:
          - '29'
          - '28'

concurrency:
  group: rosemary-s-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: vildangil
  KBUILD_BUILD_HOST: github-actions
  DEFCONFIG: rosemary_defconfig
  BUILD_VARIANT: ${{ inputs.variant || 'bakasu_susfs_nomount_droidspaces' }}
  ENABLE_USERNS: ${{ inputs.enable_userns && 'true' || 'false' }}
  ENABLE_BORE: ${{ inputs.enable_bore && 'true' || 'false' }}
  NOMOUNT_NETLINK_PROTO: ${{ inputs.nomount_netlink_proto || '29' }}

jobs:
  build:
    name: S-vendor Droidspaces / root variants
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout S-vendor source
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev lz4 python3 rsync unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Apply Droidspaces non-GKI fixes (4.14)
        run: bash .github/scripts/integrate-droidspaces.sh

      - name: Integrate BakaSU and SUSFS 2.3.0
        if: env.BUILD_VARIANT != 'stock_droidspaces'
        run: bash .github/scripts/integrate-root.sh

      - name: Clone Proton Clang early for NoMount proto28 helper
        if: contains(env.BUILD_VARIANT, 'nomount') && env.NOMOUNT_NETLINK_PROTO == '28'
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ../clang-proton
          test -x ../clang-proton/bin/clang
          echo "$PWD/../clang-proton/bin" >> "$GITHUB_PATH"

      - name: Integrate NoMount Suite
        if: contains(env.BUILD_VARIANT, 'nomount')
        run: bash .github/scripts/integrate-nomount.sh

      - name: Configure Droidspaces and root options
        run: bash .github/scripts/configure-s-droidspaces.sh

      - name: Clone Proton Clang for actual kernel build
        if: "!(contains(env.BUILD_VARIANT, 'nomount') && env.NOMOUNT_NETLINK_PROTO == '28')"
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ../clang-proton
          test -x ../clang-proton/bin/clang
          echo "$PWD/../clang-proton/bin" >> "$GITHUB_PATH"

      - name: Upload matching NoMount userspace helper
        if: contains(env.BUILD_VARIANT, 'nomount') && env.NOMOUNT_NETLINK_PROTO == '28'
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-S-nomount-nm-proto28-${{ github.run_number }}
          path: nomount-nm-proto28-arm64
          if-no-files-found: error

      - name: Build S-vendor kernel with requested features
        run: |
          set -o pipefail
          make -j4 O=out ARCH=arm64 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            2>&1 | tee build.log

      - name: Verify S-vendor kernel image
        run: |
          set -euxo pipefail
          test -s out/arch/arm64/boot/Image.gz
          gzip -t out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image*
          # Match upstream S-vendor b.sh: package Image.gz.

      - name: Package kernel-only AnyKernel3 ZIP
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch rosemary \
            https://github.com/vildangil/BlackSide_Kernel_AnyKernel3.git AnyKernel3
          test -s AnyKernel3/anykernel.sh
          test -s AnyKernel3/tools/ak3-core.sh
          rm -rf AnyKernel3/.git AnyKernel3/modules
          rm -f AnyKernel3/Image AnyKernel3/Image.gz AnyKernel3/Image.gz-dtb \
            AnyKernel3/Image-dtb AnyKernel3/dtb AnyKernel3/dtbo.img
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          test -s AnyKernel3/Image.gz
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          ZIP="rosemary-S-$BUILD_VARIANT-$SHORT_SHA.zip"
          (cd AnyKernel3 && zip -q -r9 "../$ZIP" . -x '*.git*')
          unzip -l "$ZIP" | grep -E 'anykernel.sh|Image.gz|tools/ak3-core.sh'
          echo "KERNEL_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload experimental kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-S-${{ env.BUILD_VARIANT }}-${{ github.run_number }}
          path: ${{ env.KERNEL_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-S-build-info-${{ github.run_number }}
          path: |
            build.log
            out/.config
          if-no-files-found: warn
          retention-days: 14
